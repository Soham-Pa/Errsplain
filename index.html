<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Errsplain — Explain This Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1115;
    --surface: #171A21;
    --surface-raised: #1D212B;
    --border: #2A2E38;
    --border-soft: #22252E;
    --text: #E8E6E1;
    --text-muted: #8B909C;
    --text-faint: #565B68;
    --accent: #FF8A4C;
    --accent-dim: #B8623A;
    --accent-glow: rgba(255, 138, 76, 0.15);
    --teal: #5FD9C4;
    --teal-dim: rgba(95, 217, 196, 0.12);
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255, 138, 76, 0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(95, 217, 196, 0.05), transparent 40%);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px 40px;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 100%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  h1 {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }

  h1 .cursor {
    display: inline-block;
    width: 3px;
    height: 26px;
    background: var(--accent);
    margin-left: 6px;
    vertical-align: -4px;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .subhead {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 480px;
    margin-bottom: 40px;
  }

  .terminal-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
  }

  .terminal-titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--surface-raised);
    border-bottom: 1px solid var(--border-soft);
  }

  .tb-dot {
    width: 9px;
    height: 9px;
    border-radius: 90%;
    background: var(--border);
  }

  .tb-label {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
    margin-left: 6px;
  }

  .terminal-body {
    padding: 20px;
  }

  .prompt-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .prompt-symbol {
    font-family: var(--font-mono);
    color: var(--accent);
    font-size: 15px;
    line-height: 1.6;
    padding-top: 12px;
    user-select: none;
  }

  textarea#errorInput {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 40px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.6;
    padding: 12px 14px;
    resize: vertical;
    min-height: 88px;
    width: 100%;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  textarea#errorInput::placeholder {
    color: var(--text-faint);
  }

  textarea#errorInput:focus {
    outline: none;
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .panel-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
  }

  .hint {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
  }

  button#submitBtn {
    background: var(--accent);
    color: #1A1006;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13.5px;
    border: none;
    border-radius: 40px;
    padding: 11px 22px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    letter-spacing: 0.01em;
  }

  button#submitBtn:hover {
    background: #FF9C68;
    box-shadow: 0 6px 18px -6px var(--accent-glow);
    transform: translateY(-1px);
  }

  button#submitBtn:active {
    transform: translateY(0);
  }

  #outputCard {
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 30px;
    overflow: hidden;
    display: none;
    animation: rise 0.35s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .output-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface-raised);
  }

  .output-header .stat-dot {
    width: 6px;
    height: 6px;
    border-radius: 90%;
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal-dim);
  }

  .output-header .stat-dot.no-match {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .output-header span#matchStatus {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .trace-line {
    display: flex;
    gap: 14px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border-soft);
  }

  .trace-line:last-child {
    border-bottom: none;
  }

  .trace-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 70px;
    height: fit-content;
    white-space: nowrap;
    margin-top: 1px;
  }

  .tag-info { background: rgba(139, 144, 156, 0.12); color: var(--text-muted); }
  .tag-cause { background: var(--accent-glow); color: var(--accent); }
  .tag-fix { background: var(--teal-dim); color: var(--teal); }

  .trace-text {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text);
  }

  .trace-text.code {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--teal);
    background: rgba(12, 105, 89, 0.06);
    padding: 8px 10px;
    border-radius: 16px;
    display: block;
    margin-top: 6px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  footer {
    margin-top: 48px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
    text-align: center;
  }

  @media (max-width: 480px) {
    h1 { font-size: 26px; }
    .panel-footer { flex-direction: column; align-items: stretch; gap: 12px; }
    button#submitBtn { width: 100%; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span> DEBUG TOOL</div>
    <h1>Errsplain<span class="cursor"></span></h1>
    <p class="subhead">Paste a raw error message. Get a plain-English explanation, the likely cause, and a fix — no more digging through ten Stack Overflow tabs.</p>

    <div class="terminal-panel">
      <div class="terminal-titlebar">
        <span class="tb-dot"></span>
        <span class="tb-dot"></span>
        <span class="tb-dot"></span>
        <span class="tb-label">error_input.log</span>
      </div>
      <div class="terminal-body">
        <div class="prompt-row">
          <span class="prompt-symbol">&gt;</span>
          <textarea id="errorInput" placeholder="TypeError: 'NoneType' object is not subscriptable"></textarea>
        </div>
        <div class="panel-footer">
          <span class="hint">works with Python &amp; JavaScript errors</span>
          <button id="submitBtn">Explain it</button>
        </div>
      </div>
    </div>

    <div id="outputCard">
      <div class="output-header">
        <span class="stat-dot" id="statusDot"></span>
        <span id="matchStatus">Match found</span>
      </div>
      <div class="trace-line">
        <span class="trace-tag tag-info">WHAT</span>
        <p class="trace-text" id="whatText"></p>
      </div>
      <div class="trace-line" id="causeLine">
        <span class="trace-tag tag-cause">CAUSE</span>
        <p class="trace-text" id="causeText"></p>
      </div>
      <div class="trace-line" id="fixLine">
        <span class="trace-tag tag-fix">FIX</span>
        <span class="trace-text code" id="fixText"></span>
      </div>
    </div>

    <footer>built by Soham · deployed on GitHub Pages</footer>
  </div>

<script>
  let errorDatabase = [];

  fetch('errors.json')
    .then(response => response.json())
    .then(data => {
      errorDatabase = data;
    })
    .catch(err => {
      console.error('Could not load errors.json:', err);
    });

  const submitBtn   = document.getElementById('submitBtn');
  const errorInput  = document.getElementById('errorInput');
  const outputCard  = document.getElementById('outputCard');
  const statusDot   = document.getElementById('statusDot');
  const matchStatus = document.getElementById('matchStatus');
  const whatText    = document.getElementById('whatText');
  const causeText   = document.getElementById('causeText');
  const fixText     = document.getElementById('fixText');
  const causeLine   = document.getElementById('causeLine');
  const fixLine     = document.getElementById('fixLine');

  function runMatch() {
    const pastedError = errorInput.value.trim();

    if (!pastedError) {
      return;
    }

    const match = findMatch(pastedError);

    if (match) {
      showMatch(match);
    } else {
      showNoMatch();
    }

    outputCard.style.display = 'block';
    outputCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  submitBtn.addEventListener('click', runMatch);

  errorInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault(); // stop the textarea from adding a newline
      runMatch();
    }
    // Shift+Enter falls through and does the default behavior (new line)
  });

  function findMatch(pastedError) {
    const normalizedInput = pastedError.toLowerCase();

    return errorDatabase.find(entry =>
      normalizedInput.includes(entry.keyword.toLowerCase())
    );
  }

  function showMatch(entry) {
    statusDot.classList.remove('no-match');
    matchStatus.textContent = 'Match found — ' + entry.language;

    whatText.textContent  = entry.explanation;
    causeText.textContent = entry.cause;
    fixText.textContent   = entry.fix;

    causeLine.style.display = 'flex';
    fixLine.style.display   = 'flex';
  }

  function showNoMatch() {
    statusDot.classList.add('no-match');
    matchStatus.textContent = 'No match found';

    whatText.textContent = "I don't have this exact error in my dataset yet. Try pasting just the core error line (e.g. \"TypeError: ...\") without extra file paths or line numbers.";

    causeLine.style.display = 'none';
    fixLine.style.display   = 'none';
  }
</script>

</body>
</html>
